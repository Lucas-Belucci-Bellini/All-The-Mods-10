name: EMC recipe parser tests

on:
  push:
    branches:
      - "balance/**"
  pull_request:
    branches:
      - main

jobs:
  recipe-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run recipe parser tests
        run: python -m unittest discover -s tests -v
