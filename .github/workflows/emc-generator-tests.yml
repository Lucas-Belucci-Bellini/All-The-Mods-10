name: EMC generator tests

on:
  push:
    branches:
      - balance/emc-global-rework-2026-11
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run EMC generator unit tests
        run: python -m unittest discover -s kubejs/emc_fontes -p "test_*.py" -v
